name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Buat proyek Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Persiapkan Gradle
        run: |
          chmod +x android/gradlew

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Tampilkan SHA-1 debug
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -i SHA1

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Media-Downloader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
