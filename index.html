
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769e0">
<title>Drive Media Downloader</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6fc;color:#172b4d}
header{background:#1769e0;color:white;padding:25px 15px;text-align:center}
header h1{font-size:23px}
.container{max-width:520px;margin:25px auto;padding:0 14px}
.panel{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #0001}
h2{font-size:18px}
p{font-size:13px;color:#718096;line-height:1.6}
input{width:100%;padding:13px;border:1px solid #d5deeb;border-radius:9px;font-size:14px;margin:8px 0}
button{border:0;border-radius:9px;padding:13px;font-weight:bold;font-size:14px;cursor:pointer}
.primary{background:#1769e0;color:white;width:100%;margin-top:10px}
.secondary{background:#e8f1ff;color:#1769e0;width:100%;margin-top:10px}
#status{font-size:13px;line-height:1.6;overflow-wrap:anywhere;margin-top:12px}
.item{border:1px solid #e1e7f0;border-radius:10px;padding:12px;margin-top:10px}
.item strong{display:block;font-size:14px;overflow-wrap:anywhere}
.item small{color:#718096;display:block;margin:7px 0}
.item button{background:#1769e0;color:white;width:100%}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>☁ Drive Media Downloader</h1>
<p style="color:#dce9ff">Download foto dan video Google Drive</p>
</header>
<main class="container">
<section class="panel">
<h2>Hubungkan Google Drive</h2>
<p>Masuk dengan akun Google yang memiliki akses ke file.</p>
<button class="primary" onclick="loginGoogle()">Masuk dengan Google</button>
<button class="secondary hidden" id="logout" onclick="logoutGoogle()">Keluar dari Google</button>
<div id="status">Belum terhubung.</div>
</section>

<section class="panel">
<h2>Masukkan Link Google Drive</h2>
<p>Tempel link satu file atau link folder Google Drive.</p>
<input id="driveLink" placeholder="Tempel link Google Drive...">
<button class="primary" onclick="processLink()">Periksa Link</button>
</section>

<section class="panel hidden" id="resultsPanel">
<h2>Daftar Foto dan Video</h2>
<div id="results"></div>
</section>
</main>

<script>
const CLIENT_ID = "69637949707-scbc5kc53tt44lfa810hi1i0ar9jffkc.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.readonly";

let accessToken = null;
let tokenClient = null;

function setStatus(message){
 document.getElementById("status").textContent=message;
}

function initializeGoogle(){
 if(!window.google || !google.accounts || !google.accounts.oauth2){
  setStatus("Google belum siap. Tunggu beberapa detik lalu coba lagi.");
  return false;
 }
 if(!CLIENT_ID.includes(".apps.googleusercontent.com")){
  setStatus("Client ID belum dimasukkan dengan benar.");
  return false;
 }
 if(!tokenClient){
  tokenClient=google.accounts.oauth2.initTokenClient({
   client_id:CLIENT_ID,
   scope:SCOPES,
   callback:async response=>{
    if(response.error){
     setStatus("Login gagal: "+response.error);
     return;
    }
    accessToken=response.access_token;
    setStatus("Berhasil terhubung dengan Google!");
    document.getElementById("logout").classList.remove("hidden");
   }
  });
 }
 return true;
}

function loginGoogle(){
 if(initializeGoogle()) tokenClient.requestAccessToken();
}

function logoutGoogle(){
 if(accessToken) google.accounts.oauth2.revoke(accessToken);
 accessToken=null;
 setStatus("Koneksi Google dihentikan.");
 document.getElementById("logout").classList.add("hidden");
 document.getElementById("resultsPanel").classList.add("hidden");
}

function getId(link){
 const patterns=[
  /\/folders\/([a-zA-Z0-9_-]+)/,
  /\/file\/d\/([a-zA-Z0-9_-]+)/,
  /[?&]id=([a-zA-Z0-9_-]+)/
 ];
 for(const pattern of patterns){
  const match=link.match(pattern);
  if(match) return match[1];
 }
 return null;
}

async function apiRequest(url){
 const response=await fetch(url,{
  headers:{Authorization:"Bearer "+accessToken}
 });
 if(!response.ok){
  const error=await response.json().catch(()=>({}));
  throw new Error(error.error?.message || "Google Drive API error "+response.status);
 }
 return response.json();
}

async function processLink(){
 if(!accessToken){
  alert("Silakan login Google terlebih dahulu.");
  return;
 }
 const link=document.getElementById("driveLink").value.trim();
 const id=getId(link);
 if(!id){
  alert("Link Google Drive tidak dikenali. Periksa kembali link.");
  return;
 }
 const results=document.getElementById("results");
 const panel=document.getElementById("resultsPanel");
 panel.classList.remove("hidden");
 results.innerHTML="Sedang membaca file...";
 try{
  const info=await apiRequest(
   "https://www.googleapis.com/drive/v3/files/"+id+
   "?fields=id,name,mimeType,size&supportsAllDrives=true"
  );
  if(info.mimeType==="application/vnd.google-apps.folder"){
   await listFolder(id);
  }else{
   showFiles([info]);
  }
 }catch(error){
  results.textContent="Gagal membaca: "+error.message;
 }
}

async function listFolder(folderId){
 const results=document.getElementById("results");
 results.textContent="Sedang membaca isi folder...";
 let allFiles=[];
 let pageToken="";
 try{
  do{
   let url="https://www.googleapis.com/drive/v3/files"+
    "?pageSize=100"+
    "&q="+encodeURIComponent("'"+folderId+"' in parents and trashed=false")+
    "&fields=nextPageToken,files(id,name,mimeType,size)"+
    "&supportsAllDrives=true&includeItemsFromAllDrives=true";
   if(pageToken) url+="&pageToken="+encodeURIComponent(pageToken);
   const data=await apiRequest(url);
   allFiles=allFiles.concat(data.files||[]);
   pageToken=data.nextPageToken||"";
  }while(pageToken);
  showFiles(allFiles);
 }catch(error){
  results.textContent="Gagal membaca folder: "+error.message;
 }
}

function showFiles(files){
 const results=document.getElementById("results");
 const media=files.filter(file=>
  file.mimeType &&
  (file.mimeType.startsWith("image/") ||
   file.mimeType.startsWith("video/"))
 );
 if(!media.length){
  results.textContent="Tidak ditemukan foto atau video yang dapat dibaca.";
  return;
 }
 results.innerHTML="";
 media.forEach(file=>{
  const item=document.createElement("div");
  item.className="item";
  const name=document.createElement("strong");
  name.textContent=file.name;
  const detail=document.createElement("small");
  detail.textContent=(file.mimeType.startsWith("video/")?"Video":"Foto")+
   (file.size?" • "+formatSize(Number(file.size)):"");
  const button=document.createElement("button");
  button.textContent="Download File";
  button.onclick=()=>downloadFile(file);
  item.append(name,detail,button);
  results.appendChild(item);
 });
}

function formatSize(bytes){
 if(!bytes) return "";
 const units=["B","KB","MB","GB"];
 let size=bytes,index=0;
 while(size>=1024&&index<units.length-1){
  size/=1024;index++;
 }
 return size.toFixed(2)+" "+units[index];
}

async function downloadFile(file){
 try{
  setStatus("Sedang mengunduh "+file.name+"...");
  const response=await fetch(
   "https://www.googleapis.com/drive/v3/files/"+file.id+"?alt=media",
   {headers:{Authorization:"Bearer "+accessToken}}
  );
  if(!response.ok){
   throw new Error("Download gagal. HTTP "+response.status);
  }
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  setStatus("Permintaan download selesai: "+file.name);
 }catch(error){
  setStatus("Download gagal: "+error.message);
 }
}
</script>
</body>
  </html>
