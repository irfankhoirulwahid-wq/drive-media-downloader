
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769e0">

<title>Drive Media Downloader</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f6fc;
  color: #172b4d;
}

header {
  background: #1769e0;
  color: white;
  padding: 28px 16px;
  text-align: center;
}

header h1 {
  font-size: 23px;
}

header p {
  font-size: 13px;
}

.container {
  max-width: 480px;
  margin: 30px auto;
  padding: 0 16px;
}

.panel {
  background: white;
  border-radius: 18px;
  padding: 23px;
  box-shadow: 0 5px 20px #0000000c;
  margin-bottom: 18px;
}

h2 {
  font-size: 19px;
}

p {
  font-size: 13px;
  color: #718096;
  line-height: 1.6;
}

button {
  width: 100%;
  border: 0;
  padding: 15px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

.login {
  background: #1769e0;
  color: white;
}

.logout {
  background: #e8f1ff;
  color: #1769e0;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d5deeb;
  border-radius: 10px;
  font-size: 14px;
}

#status {
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 15px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>☁ Drive Media Downloader</h1>
  <p>Download media Google Drive dengan mudah</p>
</header>

<main class="container">

<section class="panel">
  <h2>Hubungkan Google Drive</h2>

  <p>
    Login menggunakan akun Google yang memiliki
    izin mengakses file Drive.
  </p>

  <button class="login" onclick="loginGoogle()">
    Masuk dengan Google
  </button>

  <button class="logout hidden"
    id="logout"
    onclick="logoutGoogle()">
    Keluar dari Google
  </button>

  <div id="status">
    Belum terhubung dengan Google.
  </div>
</section>

<section class="panel">
  <h2>Masukkan Link Google Drive</h2>

  <p>
    Fitur pemeriksaan file akan diaktifkan
    setelah login berhasil.
  </p>

  <input
    id="driveLink"
    type="url"
    placeholder="Tempel link Google Drive...">

  <button class="login" onclick="checkConnection()">
    Periksa Koneksi
  </button>
</section>

</main>

<script>
const CLIENT_ID =
"69637949707-scbc5kc53tt44lfa810hi1i0ar9jffkc.apps.googleusercontent.com";

const SCOPES =
"https://www.googleapis.com/auth/drive.readonly";

let accessToken = null;
let tokenClient = null;

function initializeGoogle() {
  if (tokenClient) return true;

  if (!window.google ||
      !google.accounts ||
      !google.accounts.oauth2) {
    return false;
  }

  if (CLIENT_ID.startsWith("TEMPEL_")) {
    document.getElementById("status").textContent =
      "Client ID belum dimasukkan.";
    return false;
  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,

      callback: function(response) {
        if (response.error) {
          document.getElementById("status").textContent =
            "Login gagal: " + response.error;
          return;
        }

        accessToken = response.access_token;

        document.getElementById("status").textContent =
          "Berhasil terhubung dengan Google!";

        document.getElementById("logout")
          .classList.remove("hidden");
      }
    });

  return true;
}

function loginGoogle() {
  if (!initializeGoogle()) {
    document.getElementById("status").textContent =
      "Google belum siap atau Client ID belum benar. Muat ulang halaman.";
    return;
  }

  tokenClient.requestAccessToken();
}

function logoutGoogle() {
  if (accessToken && window.google) {
    google.accounts.oauth2.revoke(accessToken);
  }

  accessToken = null;

  document.getElementById("status").textContent =
    "Koneksi Google telah dihentikan.";

  document.getElementById("logout")
    .classList.add("hidden");
}

function checkConnection() {
  if (accessToken) {
    document.getElementById("status").textContent =
      "Koneksi Google aktif dan siap digunakan.";
  } else {
    document.getElementById("status").textContent =
      "Silakan login Google terlebih dahulu.";
  }
}
</script>

</body>
  </html>
